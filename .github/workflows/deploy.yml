name: Deploy to Fase A

on:
  push:
    branches:
      - master
    paths:
      - '02-terraform-module/fase-A/**'
      - '02-terraform-module/docker/backend/**'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./02-terraform-module/docker/backend
          push: true
          tags: rcastro95/portfolio-backend:${{ steps.vars.outputs.image_tag }}

  terraform-apply:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-terraform-module/fase-A/environments/dev
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Update startup-script with new image tag
        run: |
          sed -i "s|rcastro95/portfolio-backend:[^\"']*|rcastro95/portfolio-backend:${{ needs.build-and-push.outputs.image_tag }}|" startup-script.sh

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_project_id: "fase-a-504618"
          TF_VAR_application_name: "terraform-module"
          TF_VAR_region: "europe-west1"
          TF_VAR_subnet_ip_range: "10.0.0.0/16"
          TF_VAR_image_family: "debian-cloud/debian-12"
          TF_VAR_zone: "europe-west1-b"
          TF_VAR_env: "dev"
          TF_VAR_db_version: "MYSQL_8_4"
          TF_VAR_db_edition: "ENTERPRISE"
          TF_VAR_db_tier: "db-g1-small"
          TF_VAR_db_deletion_protection: "false"
          TF_VAR_db_ipv4_enabled: "false"
          TF_VAR_db_backup_enabled: "true"
          TF_VAR_db_backup_location: "europe-west1"
          TF_VAR_db_point_in_time_recovery_enabled: "true"
          TF_VAR_db_binary_log_enabled: "true"
          TF_VAR_db_backup_start_time: "03:00"
          TF_VAR_db_transaction_log_retention_days: "7"

      - name: Notify completion
        if: always()
        run: |
          echo "Pipeline finalizado con estado: ${{ job.status }}"